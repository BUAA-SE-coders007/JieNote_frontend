name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - release

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'

      # Upgrade npm to the latest version
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run lint
      - name: Run ESLint
        run: npm run lint

      # Run build
      - name: Build project
        run: npm run build